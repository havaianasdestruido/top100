name: Top Repos by Language

# Fetches the top 100 GitHub repos (by stars) for each configured language
# using the GitHub Search API, rebuilds the static site, and commits the
# results back to the repo.
#
# API usage: exactly 1 search request per language (per_page=100 gets the
# top 100 in a single call), plus small pauses to stay inside the search
# API's rate limit. N languages configured = N API calls per run.
#
# NOTE: commits made with the automatic GITHUB_TOKEN do not trigger other
# workflows, so the Pages deployment (jekyll-gh-pages.yml) listens for this
# workflow's completion instead of for pushes. Both triggers are needed.

on:
  workflow_dispatch:
    inputs:
      languages:
        description: "Comma-separated list of languages to fetch (blank = the default 30)"
        required: false
        default: ""
  schedule:
    - cron: "0 0/1 * * *"
  push:
    branches:
      - main

permissions:
  contents: write # needed for writing files

concurrency:
  group: top-repos
  cancel-in-progress: false

jobs:
  fetch-top-repos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Git Pull before anything
        run: git pull

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch top repos per language
        env:
          # GITHUB_TOKEN is auto-provided by Actions; no secret setup needed.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty for scheduled runs -> the script uses its default list of
          # 30 languages, so every language is refreshed on every run.
          LANGUAGES: ${{ github.event.inputs.languages }}
        run: python scripts/fetch_top_repos.py

      - name: Fetch this repository's own stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_FULL_NAME: ${{ github.repository }}
        run: python scripts/fetch_repo_stats.py

      - name: Build the static site
        run: python scripts/build_site.py

      # The build prints the catalogue, but these two checks are the gate:
      # a tool that breaks a naming, annotation, budget or security rule, or a
      # page whose embedded data does not line up with the generated HTML,
      # fails the run before anything is committed.
      - name: Validate the WebMCP tool catalogue
        run: python scripts/webmcp_catalog.py

      - name: Run the WebMCP runtime tests
        run: node scripts/webmcp_test.mjs

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ LISTS.md README.md
          git add index.html 404.html sitemap.xml robots.txt llms.txt llms-full.txt feed.xml
          git add assets/ languages/ methodology.html dataset.html compare.html faq.html webmcp.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: update top repos data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
