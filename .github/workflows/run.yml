name: Top Repos by Language

on:
  workflow_dispatch:
    inputs:
      languages:
        description: "Comma-separated list of languages to search (blank = the default 30)"
        required: false
        default: ""
  schedule:
    - cron: "0 * * * *"
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: top-repos
  cancel-in-progress: false

jobs:
  fetch-top-repos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Git Pull before anything
        run: git pull

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch top repos per language
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LANGUAGES: ${{ github.event.inputs.languages }}
        run: python scripts/fetch_top_repos.py

      - name: Fetch this repository's own stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_FULL_NAME: ${{ github.repository }}
        run: python scripts/fetch_repo_stats.py

      - name: Build the static site
        run: python scripts/build_site.py

      - name: Validate the WebMCP tool catalogue
        run: python scripts/webmcp_catalog.py

      - name: Run the WebMCP runtime tests
        run: node scripts/webmcp_test.mjs

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ LISTS.md README.md
          git add index.html 404.html sitemap.xml robots.txt llms.txt llms-full.txt feed.xml
          git add assets/ languages/ methodology.html dataset.html compare.html faq.html webmcp.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: update top repos data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
